<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal de Talentos - Login | SCTEC</title>
  <meta name="description" content="Acesse o Portal de Talentos do SCTEC. Para empresas, alunos e administradores.">
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Roboto:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- CSS -->
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/reset.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/login.css">
</head>
<body>

  <!-- ===========================
       LOGIN
       =========================== -->
  <section class="login-page">
    <div class="login-card">
      <!-- Header -->
      <div class="login-card__header">
        <div style="font-family: var(--font-header); font-weight: 800; font-size: 24px; margin-bottom: 4px;">Portal de Talentos</div>
        <p class="login-card__subtitle">Conectando empresas e talentos tech.</p>
      </div>

      <!-- Form -->
      <form class="login-card__form" id="login-form" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label class="form-group__label">E-mail</label>
          <input type="email" class="form-group__input" placeholder="seu@email.com.br">
        </div>
        <div class="form-group">
          <label class="form-group__label">Senha</label>
          <input type="password" class="form-group__input" placeholder="••••••••">
        </div>

        <div class="login-card__options">
          <label class="login-card__remember">
            <input type="checkbox"> Lembrar de mim
          </label>
          <a href="#" class="login-card__forgot">Esqueci minha senha</a>
        </div>

        <button type="submit" class="btn btn--primary login-card__submit">Entrar</button>
      </form>
    </div>
  </section>

  <!-- Modal de seleção de perfil (apenas para testes) -->
  <div class="modal" id="modal-perfil">
    <div class="modal__overlay" onclick="this.parentElement.classList.remove('modal--open')"></div>
    <div class="modal__content" style="max-width: 400px; text-align: center;">
      <div class="modal__header" style="justify-content: center; border-bottom: 1px solid rgba(0,0,0,0.06); padding-bottom: 16px;">
        <h2 class="modal__title" style="font-size: 18px;">Entrar como...</h2>
      </div>
      <p style="font-size: 13px; color: var(--color-text-muted); margin-bottom: 20px;">Modo de teste — selecione o perfil para visualizar</p>
      <div style="display: flex; flex-direction: column; gap: 12px;">
        <a href="admin-alunos.html" class="btn btn--secondary" style="width: 100%; justify-content: center;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
          Administrador
        </a>
        <a href="painel-candidatos.html" class="btn btn--primary" style="width: 100%; justify-content: center;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 00-2-2h-4a2 2 0 00-2 2v16"/></svg>
          Empresa
        </a>
        <a href="aluno-empresas.html" class="btn btn--outline" style="width: 100%; justify-content: center; border-color: rgba(0,0,0,0.15); color: var(--color-text-secondary);">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          Aluno
        </a>
      </div>
    </div>
  </div>

  <!-- JS -->
  <script src="../js/main.js"></script>
  <script>
    function handleLogin(e) {
      e.preventDefault();
      // Abre modal de seleção de perfil (modo teste)
      document.getElementById('modal-perfil').classList.add('modal--open');
    }
  </script>

  <div class="toast" id="toast"></div>
</body>
</html>
