  <defs>
    <!-- fundo gradiente -->
    <radialGradient id="bg" cx="60%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#1a0550"/>
      <stop offset="50%" stop-color="#0D1A32"/>
      <stop offset="100%" stop-color="#080E1F"/>
    </radialGradient>
    <!-- glow estrela -->
    <filter id="sg" x="-100%" y="-100%" width="300%" height="300%">
